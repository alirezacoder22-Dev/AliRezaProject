name: Upload Zig to Host

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
    - name: Download Zig
      run: |
        wget -q https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
        tar -xf zig-x86_64-linux-0.15.1.tar.xz
        
    - name: Split into 1MB chunks
      run: split -b 1M zig-x86_64-linux-0.15.1/zig zig_part_
        
    - name: Upload to Host via API
      run: |
        for f in zig_part_*; do
          echo "Uploading $f..."
          curl -s -X POST "http://185.141.106.126/remote.php?action=upload" \
            -H "Host: whiir.ir" \
            -H "X-Auth-Token: hdhdhxhjxjshsgdyxhxhxu" \
            -F "file=@$f" \
            -F "path=/home/whiir/public_html/$f"
          echo ""
        done
