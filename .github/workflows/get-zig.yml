name: Get Zig Binary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download and Extract Zig
      run: |
        wget -q https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
        tar -xf zig-x86_64-linux-0.15.1.tar.xz
        # تقسیم فایل زیگ به تیکه‌های ۵۰ مگابایتی
        split -b 50M zig-x86_64-linux-0.15.1/zig zig_part_
        ls -lh zig_part_*
    
    - name: Commit and Push
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add zig_part_*
        git commit -m "Add split zig binary parts"
        git push
