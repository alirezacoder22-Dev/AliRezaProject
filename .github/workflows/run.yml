name: Run LLM
on: [workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Download Model
        run: curl -L -A "Mozilla/5.0" -o smollm2.gguf "https://huggingface.co/second-state/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-0.5B-Instruct-Q2_K.gguf
      - name: Download Binary
        run: |
          wget -q https://github.com/ggml-org/llama.cpp/releases/download/b4000/llama-b4000-bin-ubuntu-x64.zip
          unzip -q llama-b4000-bin-ubuntu-x64.zip
          find . -name "llama-cli" -type f
      - name: Run Model
        run: |
          CLI_PATH=$(find . -name "llama-cli" -type f | head -n 1)
          $CLI_PATH -m smollm2.gguf -p "Once upon a time" -n 50 -t 4
