name: Run LLM Test
on: [workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Download Model
        run: wget -q https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct-GGUF/resolve/main/smollm2-135m-instruct-q4_k_m.gguf
      - name: Download Llama-cli
        run: wget -q https://github.com/ggml-org/llama.cpp/releases/download/b4000/llama-b4000-bin-ubuntu-x64.zip && unzip -q llama-b4000-bin-ubuntu-x64.zip
      - name: Run Model
        run: ./build/bin/llama-cli -m smollm2-135m-instruct-q4_k_m.gguf -p "Once upon a time" -n 50 -t 4
