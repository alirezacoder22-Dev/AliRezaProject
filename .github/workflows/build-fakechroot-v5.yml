name: Build fakechroot v5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git autoconf automake libtool gettext

    - name: Build fakechroot
      run: |
        git clone --depth 1 https://github.com/dex4er/fakechroot.git /tmp/src
        cd /tmp/src
        grep -rl '_STAT_VER' src/ | xargs sed -i 's/_STAT_VER/0/g'
        ./autogen.sh
        ./configure --prefix=/usr
        make -j$(nproc)
        cp src/.libs/libfakechroot.so $GITHUB_WORKSPACE/libfakechroot-glibc.so
        ls -lh $GITHUB_WORKSPACE/libfakechroot-glibc.so

    - name: Commit
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add libfakechroot-glibc.so
        git commit -m "Add libfakechroot glibc" || echo "no changes"
        git push
