name: Get Zig Lib Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download and Extract Zig
      run: |
        wget -q https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
        tar -xf zig-x86_64-linux-0.15.1.tar.xz
    - name: Zip the lib folder
      run: |
        cd zig-x86_64-linux-0.15.1
        zip -r ../lib.zip lib
        cd ..
        ls -lh lib.zip
    - name: Commit and Push
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add lib.zip
        git commit -m "Add zig lib.zip"
        git push
