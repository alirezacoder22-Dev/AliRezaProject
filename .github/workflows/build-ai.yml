name: Build AI Model x86_64 Static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install GCC and libc-dev
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev
    
    - name: Compile mainTest.c (Static)
      run: |
        gcc -std=c2x -D__STDC_VERSION__=202311L -Ilib mainTest.c -o mainTest -lm -O3 -static
        ls -lh mainTest
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ai-model-binary
        path: mainTest
        retention-days: 3
